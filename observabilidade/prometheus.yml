# Prometheus raspa as métricas (Micrometer) dos três microsserviços e do RabbitMQ.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: monitor-ieducar
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["monitor-ieducar:8080"]

  - job_name: sincronizador
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["sincronizador:8080"]

  - job_name: publicador-moodle
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["publicador-moodle:8080"]

  # métricas do broker (plugin rabbitmq_prometheus): mensagens prontas por fila, DLQ, conexões...
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
