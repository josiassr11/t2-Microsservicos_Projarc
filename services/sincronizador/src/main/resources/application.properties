spring.application.name=sincronizador
server.port=8080
spring.main.banner-mode=off

# --- Banco (somente deste serviço) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sincronizador}
spring.datasource.username=${DB_USER:sincronizador}
spring.datasource.password=${DB_PASSWORD:sincronizador}
spring.flyway.enabled=true

# --- RabbitMQ ---
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
# publisher confirm + mandatory/returns: só vale "publicado" quando o broker confirmar e houver fila ligada
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.template.observation-enabled=true
spring.rabbitmq.listener.simple.observation-enabled=true
# rejeitada = DLQ (sem voltar para a fila); o retry é feito por PoliticaDeTentativas
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.prefetch=1
# reconexão automática: o serviço sobrevive a reinício do broker
spring.rabbitmq.listener.simple.missing-queues-fatal=false
spring.rabbitmq.connection-timeout=5s
sincronizador.retry.max-tentativas=${RETRY_MAX_TENTATIVAS:3}
sincronizador.retry.backoff=${RETRY_BACKOFF:PT1S}
sincronizador.publicacao.timeout-confirm=${PUBLICACAO_TIMEOUT_CONFIRM:PT5S}

# --- Observabilidade ---
management.endpoints.web.exposure.include=health,prometheus,info
management.endpoint.health.show-details=never
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
management.otlp.tracing.endpoint=${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
management.metrics.tags.servico=sincronizador
management.observations.annotations.enabled=true

# --- Logs: texto didático por padrão; LOG_FORMATO=json ativa o perfil "json" ---
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [${spring.application.name}] [corr=%X{correlationId:--}] %msg%n
logging.level.org.springframework.amqp=WARN
logging.level.org.flywaydb=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.io.opentelemetry=WARN
logging.level.io.opentelemetry.exporter=OFF
