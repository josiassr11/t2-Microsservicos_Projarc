spring.application.name=monitor-ieducar
server.port=8080
spring.profiles.active=${LOG_FORMATO:texto}

# --- Logs: texto legível (padrão) ou JSON (LOG_FORMATO=json ativa o perfil "json") ---
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [${spring.application.name}] [corr=%X{correlationId:--}] %msg%n
logging.charset.console=UTF-8
logging.level.com.pucrs.monitorieducar=INFO
# o MDC (correlationId) é preenchido pela própria aplicação

# --- Banco PRÓPRIO do serviço ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/monitor}
spring.datasource.username=${DB_USER:monitor}
spring.datasource.password=${DB_PASSWORD:monitor}
spring.flyway.enabled=true

# --- RabbitMQ: publisher confirm + mandatory/returns (mensagem sem fila volta como falha) ---
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.connection-timeout=PT5S
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.template.observation-enabled=true
spring.rabbitmq.listener.simple.observation-enabled=true

# --- iEducar (origem) ---
ieducar.base-url=${IEDUCAR_URL:http://localhost:8080}
ieducar.token=${IEDUCAR_API_TOKEN:ieducar-integracao-token-trocar-em-producao-0000}
ieducar.access-key=${IEDUCAR_API_ACCESS_KEY:ieducar-access-key}
ieducar.secret-key=${IEDUCAR_API_SECRET_KEY:ieducar-secret-key}
ieducar.instituicao-id=${IEDUCAR_INSTITUICAO_ID:1}

# --- Varredura agendada ---
monitor.agendado=${MONITOR_AGENDADO:true}
monitor.intervalo=${MONITOR_INTERVALO:PT1M}
monitor.atraso-inicial=${MONITOR_ATRASO_INICIAL:PT20S}
monitor.confirm-timeout=${MONITOR_CONFIRM_TIMEOUT:PT5S}

# --- Resiliência nas chamadas ao iEducar (timeout + retry + circuit breaker) ---
resiliencia.timeout-conexao=${RESILIENCIA_TIMEOUT_CONEXAO:PT3S}
resiliencia.timeout-leitura=${RESILIENCIA_TIMEOUT_LEITURA:PT10S}
resiliencia.retry.max-tentativas=${RESILIENCIA_RETRY_MAX_TENTATIVAS:3}
resiliencia.retry.espera=${RESILIENCIA_RETRY_ESPERA:PT0.5S}
resiliencia.retry.multiplicador=${RESILIENCIA_RETRY_MULTIPLICADOR:2.0}
resiliencia.circuito.janela=${RESILIENCIA_CIRCUITO_JANELA:6}
resiliencia.circuito.minimo-chamadas=${RESILIENCIA_CIRCUITO_MINIMO_CHAMADAS:4}
resiliencia.circuito.taxa-falha-percentual=${RESILIENCIA_CIRCUITO_TAXA_FALHA:50}
resiliencia.circuito.espera-aberto=${RESILIENCIA_CIRCUITO_ESPERA_ABERTO:PT20S}
resiliencia.circuito.chamadas-meio-aberto=${RESILIENCIA_CIRCUITO_CHAMADAS_MEIO_ABERTO:2}

# --- Observabilidade: Actuator + Prometheus + tracing OTLP (Jaeger) ---
management.endpoints.web.exposure.include=health,prometheus,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
# só métricas via Prometheus (scrape); o starter do OpenTelemetry tentaria também empurrar métricas OTLP
management.otlp.metrics.export.enabled=false
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
management.metrics.tags.application=${spring.application.name}
