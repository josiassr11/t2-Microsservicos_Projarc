spring.application.name=publicador-moodle
server.port=8080

# --- Banco próprio do serviço (ninguém mais acessa) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5435/publicador}
spring.datasource.username=${DB_USER:publicador}
spring.datasource.password=${DB_PASSWORD:publicador}
spring.flyway.enabled=true

# --- RabbitMQ ---
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
# publisher confirm: só consideramos publicado quando o broker confirma; mandatory: sem fila ligada = devolvida (falha)
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.template.observation-enabled=true
spring.rabbitmq.listener.simple.observation-enabled=true
# um comando por vez: a ordem de aplicação no Moodle importa (categoria -> curso -> usuários -> inscrições)
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.concurrency=1

# --- Moodle (destino) ---
moodle.base-url=${MOODLE_URL:http://localhost:8081}
moodle.token=${MOODLE_WS_TOKEN:a1b2c3d4e5f60718293a4b5c6d7e8f90}
moodle.papel-aluno-id=${MOODLE_PAPEL_ALUNO_ID:5}
moodle.papel-professor-id=${MOODLE_PAPEL_PROFESSOR_ID:3}
moodle.senha-inicial=${MOODLE_SENHA_INICIAL:Mudar@2026!}
moodle.dominio-email=${MOODLE_DOMINIO_EMAIL:exemplo.edu.br}
moodle.timeout-conexao=${MOODLE_TIMEOUT_CONEXAO:PT3S}
moodle.timeout-leitura=${MOODLE_TIMEOUT_LEITURA:PT10S}

# --- Resiliência nas chamadas ao Moodle (retry + circuit breaker) ---
resiliencia.retry-tentativas=${RESILIENCIA_RETRY_TENTATIVAS:3}
resiliencia.retry-intervalo=${RESILIENCIA_RETRY_INTERVALO:PT0.5S}
resiliencia.retry-multiplicador=${RESILIENCIA_RETRY_MULTIPLICADOR:2.0}
resiliencia.cb-janela=${RESILIENCIA_CB_JANELA:6}
resiliencia.cb-minimo-chamadas=${RESILIENCIA_CB_MINIMO_CHAMADAS:4}
resiliencia.cb-limite-falha=${RESILIENCIA_CB_LIMITE_FALHA:50}
resiliencia.cb-tempo-aberto=${RESILIENCIA_CB_TEMPO_ABERTO:PT20S}
resiliencia.cb-chamadas-meio-aberto=${RESILIENCIA_CB_CHAMADAS_MEIO_ABERTO:2}

# --- Injeção de falha (apenas para demonstrar o cenário "Moodle indisponível") ---
falha-injetavel.habilitada=${FALHA_INJETAVEL:false}

# --- Observabilidade ---
management.endpoints.web.exposure.include=health,prometheus,info
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [${spring.application.name}] [corr=%X{correlationId:--}] %msg%n
logging.level.com.pucrs.publicadormoodle=INFO
logging.level.org.springframework.amqp.rabbit.connection=WARN
logging.level.org.springframework.amqp.rabbit.listener=WARN
logging.level.io.opentelemetry=OFF
management.otlp.metrics.export.enabled=false
